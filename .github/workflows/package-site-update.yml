name: Package site update

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload final site update
        uses: actions/upload-artifact@v4
        with:
          name: sanoteam-final-update
          path: |
            index.html
            fa/*.html
            en/*.html
            ar/*.html
          if-no-files-found: error
          retention-days: 1
